<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>幻都異世界｜PHANTOM METROPOLIS</title>

<link rel="stylesheet" href="./assets/css/main.css">

<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">  

</head>

<body>

<div id="game"></div>

<div id="landing">
  <div class="landing-atmosphere"></div>

  <div class="landing-stage">

    <div class="landing-ui">

      <div class="landing-brand">
  <img
    src="./assets/phantom-metropolis-logo.png"
    alt="幻都異世界 PHANTOM METROPOLIS"
    class="landing-brand-logo"
  >
</div>

      <div class="landing-menu">

        <button
          id="startGame"
          class="landing-menu-btn landing-menu-primary"
        >
          <span class="landing-menu-icon"><i class="fa-solid fa-play"></i></span>
          <span class="landing-menu-text">開始遊戲</span>
          <span class="landing-menu-arrow">›</span>
        </button>

        <button
          id="gameIntroBtn"
          class="landing-menu-btn landing-menu-secondary"
        >
          <span class="landing-menu-icon"><i class="fa-solid fa-book-open"></i></span>
          <span class="landing-menu-text">遊戲介紹</span>
          <span class="landing-menu-arrow">›</span>
        </button>

        <button
          id="settingsBtn"
          class="landing-menu-btn landing-menu-secondary"
        >
          <span class="landing-menu-icon"><i class="fa-solid fa-gear"></i></span>
          <span class="landing-menu-text">設定</span>
          <span class="landing-menu-arrow">›</span>
        </button>

        <button
          id="creditsBtn"
          class="landing-menu-btn landing-menu-secondary"
        >
          <span class="landing-menu-icon"><i class="fa-solid fa-users"></i></span>
          <span class="landing-menu-text">製作團隊</span>
          <span class="landing-menu-arrow">›</span>
        </button>

        <button
          id="exitBtn"
          class="landing-menu-btn landing-menu-secondary"
        >
          <span class="landing-menu-icon"><i class="fa-solid fa-right-from-bracket"></i></span>
          <span class="landing-menu-text">離開</span>
          <span class="landing-menu-arrow">›</span>
        </button>

      </div>

    </div>

  </div>
</div>

<div id="gameIntroScreen" style="
  position:fixed;
  inset:0;
  z-index:24;
  display:none;
  overflow:auto;
  padding:48px;
  background:
    linear-gradient(
      rgba(4,6,10,.82),
      rgba(4,6,10,.94)
    ),
    url('./assets/taichung-unbound-cover.png')
    center center / cover no-repeat;
">
  <button id="backFromIntroBtn" style="
    position:fixed;
    top:24px;
    left:24px;
    z-index:2;
    padding:12px 18px;
    border:1px solid rgba(255,255,255,.18);
    border-radius:12px;
    background:rgba(8,12,20,.78);
    color:#fff;
    cursor:pointer;
    backdrop-filter:blur(12px);
  ">
    ← 返回主選單
  </button>
  <div style="
  width:min(1180px,calc(100% - 40px));
  margin:70px auto 40px;
">

  <div style="
    margin-bottom:28px;
    text-align:center;
  ">
    <div style="
      color:#b79cff;
      font-size:12px;
      letter-spacing:.28em;
      margin-bottom:10px;
    ">
      WORLD OVERVIEW
    </div>

    <h2 style="
      margin:0;
      font-size:clamp(32px,4vw,54px);
    ">
      幻都異世界
    </h2>

    <div style="
      margin-top:8px;
      color:#aeb8ca;
      letter-spacing:.18em;
    ">
      PHANTOM METROPOLIS
    </div>
  </div>

  <div style="
    display:flex;
    justify-content:center;
    flex-wrap:wrap;
    gap:10px;
    margin-bottom:28px;
  ">
    <button class="intro-tab" data-intro-tab="eras">年代</button>
    <button class="intro-tab" data-intro-tab="regions">地區</button>
    <button class="intro-tab" data-intro-tab="characters">人物／寵物</button>
    <button class="intro-tab" data-intro-tab="vehicles">車輛</button>
    <button class="intro-tab" data-intro-tab="gameplay">遊戲玩法</button>
  </div>

  <div id="introContent" style="
    min-height:420px;
    padding:32px;
    border:1px solid rgba(177,150,255,.18);
    border-radius:24px;
    background:rgba(6,9,15,.72);
    backdrop-filter:blur(18px);
    box-shadow:0 24px 70px rgba(0,0,0,.35);
  ">
    <div style="
      text-align:center;
      color:#cbd3df;
      padding:120px 20px;
    ">
      選擇上方分類，探索《幻都異世界》的世界。
    </div>
  </div>

</div>
</div>
  
<div id="loginScreen" style="
  position:fixed;
  inset:0;
  z-index:25;
  display:none;
  align-items:center;
  justify-content:flex-end;
  padding:60px;
  overflow:hidden;
  background:
  linear-gradient(
    90deg,
    rgba(4,6,10,.18) 0%,
    rgba(4,6,10,.34) 45%,
    rgba(4,6,10,.88) 78%,
    rgba(4,6,10,.96) 100%
  ),
  url('./assets/phantom-metropolis-login-bg.png')
  center center / cover no-repeat;
">

  <div style="
  width:min(480px,100%);
  padding:42px 40px;
  animation:loginPanelIn .55s cubic-bezier(.2,.8,.2,1) both;

  border:1px solid rgba(196,170,255,.42);
  border-radius:30px;

  background:
    linear-gradient(
      145deg,
      rgba(22,18,44,.82),
      rgba(8,10,24,.76)
    );

  backdrop-filter:blur(30px) saturate(1.25);
  -webkit-backdrop-filter:blur(30px) saturate(1.25);

  box-shadow:
    inset 0 1px 0 rgba(255,255,255,.08),
    0 0 0 1px rgba(147,94,255,.08),
    0 0 34px rgba(123,74,255,.28),
    0 28px 80px rgba(0,0,0,.55);
">

    <div style="
      color:#b79cff;
      font-size:12px;
      letter-spacing:.28em;
      margin-bottom:8px;
    ">
      PHANTOM METROPOLIS
    </div>

    <h2 style="
      margin:0 0 8px;
      font-size:30px;
    ">
      登入幻都異世界
    </h2>

    <p style="
      margin:0 0 24px;
      color:#aeb8ca;
      line-height:1.7;
      font-size:14px;
    ">
      登入後可保存角色、資產、寵物、車輛與遊戲進度。
    </p>

    <input
  type="email"
  placeholder="輸入 Email"
  style="
    width:100%;
    padding:16px 18px;
    margin-bottom:14px;

    border:1px solid rgba(190,165,255,.34);
    border-radius:14px;

    background:rgba(10,12,28,.66);
    color:#fff;

    outline:none;
    font-size:15px;

    backdrop-filter:blur(14px);
    -webkit-backdrop-filter:blur(14px);

    box-shadow:
      inset 0 1px 0 rgba(255,255,255,.04),
      0 0 18px rgba(124,77,255,.10);

    transition:
      border-color .18s ease,
      box-shadow .18s ease,
      background .18s ease;
  "
>

  <button id="emailLoginBtn" style="
  width:100%;
  padding:16px;

  border:1px solid rgba(220,200,255,.7);
  border-radius:14px;

  background:
    linear-gradient(
      135deg,
      #9b5cff 0%,
      #7c4dff 48%,
      #5d35c8 100%
    );

  color:#fff;

  font-size:16px;
  font-weight:800;
  letter-spacing:.05em;

  cursor:pointer;

  box-shadow:
    inset 0 1px 0 rgba(255,255,255,.20),
    0 0 28px rgba(124,77,255,.42),
    0 12px 34px rgba(0,0,0,.32);

  transition:
    transform .16s ease,
    filter .16s ease,
    box-shadow .16s ease;
">
  Email 登入 →
</button>

<button id="guestLoginBtn" style="
  width:100%;
  padding:15px;
  margin-top:12px;

  border:1px solid rgba(190,165,255,.28);
  border-radius:14px;

  background:
    linear-gradient(
      135deg,
      rgba(255,255,255,.08),
      rgba(130,95,210,.10)
    );

  color:#e2e6f2;

  font-size:15px;
  font-weight:700;
  letter-spacing:.04em;

  cursor:pointer;

  backdrop-filter:blur(14px);
  -webkit-backdrop-filter:blur(14px);

  box-shadow:
    inset 0 1px 0 rgba(255,255,255,.05),
    0 8px 24px rgba(0,0,0,.22);

  transition:
    transform .16s ease,
    border-color .16s ease,
    background .16s ease,
    box-shadow .16s ease;
">
  訪客模式進入
</button>

  <button id="backToLandingBtn" style="
  width:100%;
  margin-top:18px;
  padding:11px 12px;

  border:0;
  background:transparent;

  color:#aeb7c8;

  font-size:13px;
  font-weight:600;
  letter-spacing:.04em;

  cursor:pointer;

  opacity:.92;

  transition:
    color .16s ease,
    opacity .16s ease,
    transform .16s ease;
">
  ← 返回幻都異世界首頁
</button>

  </div>
</div>
  
<div id="loading">
  LOADING PHANTOM METROPOLIS...
</div>

<div id="hud">
  <div class="logo">
    <strong>幻都異世界</strong>
    <span>PHANTOM METROPOLIS</span>
  </div>

  <div class="mission">
  <small>主線任務 01</small>
  <b>第一次踏入幻都</b>
  <p>探索幻都街區、接受任務、蒐集資產，開啟你的城市人生。</p>
</div>

  <div class="player-info">
    <div id="currentEra" class="location">現代｜狂城</div>
    <div class="hp"></div>
  </div>

  <div class="controls">
    W A S D 移動　｜　Shift 加速　｜　滑鼠拖曳旋轉視角
  </div>
  <div id="vehicleHint" class="controls" style="bottom:62px;display:none;">
  按 E 上車
</div>
</div>

<script type="importmap">
{
  "imports":{
    "three":"https://unpkg.com/three@0.180.0/build/three.module.js",
    "three/addons/":"https://unpkg.com/three@0.180.0/examples/jsm/"
  }
}
</script>

<script type="module" src="./assets/js/main.js"></script>

</body>
</html>
